<div class="min-h-screen bg-slate-50 dark:bg-slate-900 flex items-center justify-center p-4 transition-colors duration-300">
  <div class="max-w-md w-full bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 p-8 text-center transition-colors duration-300">
    <h2 class="text-3xl font-extrabold text-slate-900 dark:text-white mb-2 transition-colors">Forgot Password?</h2>
    <p class="text-slate-500 dark:text-slate-400 mb-6 transition-colors">Enter your email and we'll send you a link to reset it.</p>
    
    <div *ngIf="isSuccess" class="bg-green-100 dark:bg-green-900/30 text-green-700 dark:text-green-400 p-4 rounded-lg mb-6 text-sm font-medium transition-colors">
      {{ message }}
    </div>

    <form (ngSubmit)="onSubmit()" *ngIf="!isSuccess" class="space-y-4">
      <input type="email" [(ngModel)]="email" name="email" placeholder="Email address" required
             class="w-full px-4 py-2 border border-slate-300 dark:border-slate-600 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all dark:bg-slate-700 dark:text-white dark:placeholder-slate-400">
      <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg transition-colors">
        Send Reset Link
      </button>
    </form>

    <p class="mt-4 text-sm text-slate-600 dark:text-slate-400 transition-colors">
      Remembered it? <a routerLink="/login" class="text-blue-600 dark:text-blue-400 font-semibold hover:underline">Back to login</a>
    </p>
  </div>
</div>
