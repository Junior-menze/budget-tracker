<div class="min-h-screen bg-slate-50 flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-sm border border-slate-200 p-8 text-center">
    <h2 class="text-3xl font-extrabold text-slate-900 mb-2">Forgot Password?</h2>
    <p class="text-slate-500 mb-6">Enter your email and we'll send you a link to reset it.</p>
    
    <div *ngIf="isSuccess" class="bg-green-100 text-green-700 p-4 rounded-lg mb-6 text-sm font-medium">
      {{ message }}
    </div>

    <form (ngSubmit)="onSubmit()" *ngIf="!isSuccess" class="space-y-4">
      <input type="email" [(ngModel)]="email" name="email" placeholder="Email address" required
             class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg transition-colors">
        Send Reset Link
      </button>
    </form>

    <p class="mt-4 text-sm text-slate-600">
      Remembered it? <a routerLink="/login" class="text-blue-600 font-semibold hover:underline">Back to login</a>
    </p>
  </div>
</div>
