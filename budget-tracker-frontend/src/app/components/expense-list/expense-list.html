<div class="container">
  <h2>Add an Expense</h2>
  
  <form (ngSubmit)="onSubmit()" #expenseForm="ngForm" class="expense-form">
    <input type="text" [(ngModel)]="newExpense.description" name="description" placeholder="Description (e.g. Groceries)" required>
    <input type="number" [(ngModel)]="newExpense.amount" name="amount" placeholder="Amount" required>
    
    <select [(ngModel)]="newExpense.category" name="category">
      <option value="Food">Food</option>
      <option value="Rent">Rent</option>
      <option value="Transport">Transport</option>
      <option value="Entertainment">Entertainment</option>
    </select>

    <button type="submit" [disabled]="!expenseForm.form.valid">Add Expense</button>
  </form>

  <hr>

  <h2>My Expenses</h2>
  <table class="expense-table">
    <thead>
      <tr>
        <th>Date</th>
        <th>Description</th>
        <th>Category</th>
        <th>Amount</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let expense of expenses">
        <td>{{ expense.date | date:'shortDate' }}</td>
        <td>{{ expense.description }}</td>
        <td>{{ expense.category }}</td>
        <td>R {{ expense.amount }}</td>
      </tr>
      <tr *ngIf="expenses.length === 0">
        <td colspan="4">No expenses found. Add one above!</td>
      </tr>
    </tbody>
  </table>
</div>
