<div class="min-h-screen bg-slate-50 flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
    <h2 class="text-3xl font-extrabold text-slate-900 text-center mb-6">Welcome Back</h2>
    
    <div *ngIf="errorMessage" class="bg-red-100 text-red-700 p-3 rounded-lg mb-4 text-sm">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="onLogin()" #loginForm="ngForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
        <input type="email" [(ngModel)]="loginData.email" name="email" required
               class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
           <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
        <div class="relative">
          <!-- Dynamic type binding to toggle visibility -->
          <input [type]="showPassword ? 'text' : 'password'" 
                 [(ngModel)]="loginData.password" name="password" required
                 class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none pr-10">
          
          <!-- The Eye Icon Button -->
          <button type="button" (click)="togglePassword()" 
                  class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none">
            
            <!-- Open Eye Icon -->
            <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>

            <!-- Closed Eye Icon -->
            <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
            </svg>
          </button>
        </div>
        <div class="flex justify-end">
  <a routerLink="/forgot-password" class="text-sm font-medium text-blue-600 hover:underline">Forgot password?</a>
</div>
      </div>
      <button type="submit" [disabled]="!loginForm.form.valid"
              class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg transition-colors disabled:bg-slate-300">
        Log In
      </button>
    </form>

    <p class="mt-4 text-center text-sm text-slate-600">
      Don't have an account? <a routerLink="/register" class="text-blue-600 font-semibold hover:underline">Register here</a>
    </p>
  </div>
</div>
