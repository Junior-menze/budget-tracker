<div class="min-h-screen bg-slate-50 dark:bg-slate-900 flex items-center justify-center p-4 transition-colors duration-300">
  <div class="max-w-md w-full bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 p-8 text-center transition-colors duration-300">
    <h2 class="text-3xl font-extrabold text-slate-900 dark:text-white mb-6 transition-colors">Set New Password</h2>
    
    <div *ngIf="errorMessage" class="bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-400 p-3 rounded-lg mb-4 text-sm transition-colors">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <input type="password" [(ngModel)]="newPassword" name="newPassword" placeholder="New Password" required
             class="w-full px-4 py-2 border border-slate-300 dark:border-slate-600 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all dark:bg-slate-700 dark:text-white dark:placeholder-slate-400">
      <button type="submit" class="w-full py-3 bg-slate-900 hover:bg-slate-800 dark:bg-blue-600 dark:hover:bg-blue-700 text-white font-bold rounded-lg transition-colors">
        Reset Password
      </button>
    </form>
  </div>
</div>
