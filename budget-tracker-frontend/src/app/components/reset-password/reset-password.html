<div class="min-h-screen bg-slate-50 flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-sm border border-slate-200 p-8 text-center">
    <h2 class="text-3xl font-extrabold text-slate-900 mb-6">Set New Password</h2>
    
    <div *ngIf="errorMessage" class="bg-red-100 text-red-700 p-3 rounded-lg mb-4 text-sm">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <input type="password" [(ngModel)]="newPassword" name="newPassword" placeholder="New Password" required
             class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      <button type="submit" class="w-full py-3 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-lg transition-colors">
        Reset Password
      </button>
    </form>
  </div>
</div>
