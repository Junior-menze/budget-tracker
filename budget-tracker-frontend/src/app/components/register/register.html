<div class="min-h-screen bg-slate-50 dark:bg-slate-900 flex items-center justify-center p-4 transition-colors duration-300">
  <div class="max-w-md w-full bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 p-8 transition-colors duration-300">
    <h2 class="text-3xl font-extrabold text-slate-900 dark:text-white text-center mb-6 transition-colors">Create Account</h2>
    
    <form (ngSubmit)="onRegister()" #regForm="ngForm" class="space-y-4">
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1 transition-colors">First Name</label>
          <input type="text" [(ngModel)]="registerData.firstName" name="firstName" required
                 class="w-full px-4 py-2 border border-slate-300 dark:border-slate-600 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all dark:bg-slate-700 dark:text-white">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1 transition-colors">Last Name</label>
          <input type="text" [(ngModel)]="registerData.lastName" name="lastName" required
                 class="w-full px-4 py-2 border border-slate-300 dark:border-slate-600 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all dark:bg-slate-700 dark:text-white">
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1 transition-colors">Email</label>
        <input type="email" [(ngModel)]="registerData.email" name="email" required
               class="w-full px-4 py-2 border border-slate-300 dark:border-slate-600 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all dark:bg-slate-700 dark:text-white">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1 transition-colors">Password</label>
        <div class="relative">
          <input [type]="showPassword ? 'text' : 'password'" 
                 [(ngModel)]="registerData.password" name="password" required
                 class="w-full px-4 py-2 border border-slate-300 dark:border-slate-600 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none pr-10 transition-all dark:bg-slate-700 dark:text-white">
          <button type="button" (click)="togglePassword()" 
                  class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 dark:text-slate-500 dark:hover:text-slate-300 focus:outline-none">
            <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
            <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" /></svg>
          </button>
        </div>
      </div>
      <button type="submit" [disabled]="!regForm.form.valid || isLoading"
              class="w-full py-3 bg-slate-900 hover:bg-slate-800 dark:bg-blue-600 dark:hover:bg-blue-700 text-white font-bold rounded-lg transition-colors disabled:bg-slate-300 dark:disabled:bg-slate-700 flex justify-center items-center">
        <span *ngIf="!isLoading">Register</span>
        <span *ngIf="isLoading">Registering...</span>
      </button>
    </form>

    <p class="mt-4 text-center text-sm text-slate-600 dark:text-slate-400 transition-colors">
      Already have an account? <a routerLink="/login" class="text-blue-600 dark:text-blue-400 font-semibold hover:underline">Log in here</a>
    </p>
  </div>
</div>

<!-- MODAL OVERLAY -->
<div *ngIf="showModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 dark:bg-slate-900/80 backdrop-blur-sm transition-colors">
  <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-xl max-w-sm w-full p-6 text-center transform transition-all border border-transparent dark:border-slate-700">
    
    <div *ngIf="modalType === 'success'" class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-green-100 dark:bg-green-900/30 mb-4 transition-colors">
      <svg class="h-10 w-10 text-green-600 dark:text-green-400" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" /></svg>
    </div>

    <div *ngIf="modalType === 'error'" class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-red-100 dark:bg-red-900/30 mb-4 transition-colors">
      <svg class="h-10 w-10 text-red-600 dark:text-red-400" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
    </div>

    <h3 class="text-xl font-bold text-slate-900 dark:text-white mb-2 transition-colors">
      {{ modalType === 'success' ? 'Success!' : 'Registration Failed' }}
    </h3>
    <p class="text-slate-500 dark:text-slate-400 mb-6 transition-colors">{{ modalMessage }}</p>

    <button (click)="closeModal()" 
            class="w-full py-2.5 rounded-lg font-semibold text-white transition-colors"
            [ngClass]="modalType === 'success' ? 'bg-green-600 hover:bg-green-700' : 'bg-red-600 hover:bg-red-700'">
      {{ modalType === 'success' ? 'Continue to Login' : 'Try Again' }}
    </button>
  </div>
</div>
